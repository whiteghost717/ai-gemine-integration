
name: Build Dokaibe

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Check Java Version
        run: |
          java -version
          mvn -version

      - name: Build with Maven
        run: mvn --batch-mode -f Dokaibe-Gemini-Integrated/pom.xml clean package

      - name: Upload Plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: Dokaibe-Plugin
          path: Dokaibe-Gemini-Integrated/target/*.jar
          if-no-files-found: error
